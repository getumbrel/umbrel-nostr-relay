name: Build and publish Docker image on tag

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  test:
    name: Test relay proxy and dashboard reconnects
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build test image
        run: docker build --tag nostr-relay-proxy:test ./relay-proxy

      - name: Run regression tests
        run: |
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE/relay-proxy:/src/relay-proxy:ro" \
            --volume "$GITHUB_WORKSPACE/ui/src:/src/ui/src:ro" \
            --workdir /src/relay-proxy --entrypoint sh nostr-relay-proxy:test \
            -c 'ln -s /app/node_modules /src/node_modules; node --test test/*.test.js'

  build:
    needs: test
    name: Build Docker image
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service:
          - directory: 'ui'
            name: 'umbrel-nostr-relay'
          - directory: 'relay-proxy'
            name: 'umbrel-nostr-relay-proxy'
          - directory: 'engine'
            name: 'nostr-rs-relay'
    env:
      IMAGE_NAME: ${{ matrix.service.name }}
      IMAGE_TAG: ${{ matrix.service.name == 'nostr-rs-relay' && format('0.10.0-{0}', github.ref_name) || github.ref_name }}
      # CI is private; images are published to the existing public Docker Hub repositories.
      DOCKER_HUB_USER: getumbrel
    steps:

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout pinned engine wrapper
        if: matrix.service.name == 'nostr-rs-relay'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: getumbrel/docker-nostr-rs-relay
          ref: 697fa49332f7923a6afcc28011a9c55cac57c9d9
          path: engine

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Setup Docker buildx action
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Run Docker buildx
        working-directory: ${{ matrix.service.directory }}
        run: |
          docker buildx build \
          --tag "$DOCKER_HUB_USER/$IMAGE_NAME:$IMAGE_TAG" \
          --platform linux/amd64,linux/arm64 \
          --push .
