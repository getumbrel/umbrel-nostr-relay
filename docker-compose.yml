version: "3.7"

services:
  web:
    # image: getumbrel/umbrel-nostr-relay
    build: ./ui
    user: "1000:1000"
    restart: on-failure
    environment:
      RELAY_HOST: "relay"
      RELAY_PORT: "8080"
      RELAY_PROXY_HOST: "relay-proxy"
      RELAY_PROXY_PORT: "80"
    ports:
      - 3000:3000

  relay:
    image: getumbrel/nostr-rs-relay:0.10.0-v1.2.0
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ${PWD}/data/relay/config.toml:/app/config.toml
      - ${PWD}/data/relay/db:/app/db

  relay-proxy:
    # image: getumbrel/umbrel-nostr-relay-proxy
    build: ./relay-proxy
    user: "1000:1000"
    restart: on-failure
    environment:
      RELAY_HOST: "relay"
      RELAY_PORT: "8080"
    volumes:
      - ${PWD}/data/relay-proxy:/app/data
    depends_on:
      - relay