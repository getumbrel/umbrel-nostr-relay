name: Build and publish Nostr images

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: nostr-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test relay proxy and dashboard reconnects
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build test image
        run: docker build --tag nostr-relay-proxy:test ./relay-proxy

      - name: Run regression tests
        run: |
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE/relay-proxy:/src/relay-proxy:ro" \
            --volume "$GITHUB_WORKSPACE/ui/src:/src/ui/src:ro" \
            --workdir /src/relay-proxy --entrypoint sh nostr-relay-proxy:test \
            -c 'ln -s /app/node_modules /src/node_modules; node --test test/*.test.js'

  build:
    needs: test
    name: Build ${{ matrix.service.name }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - directory: 'ui'
            name: 'umbrel-nostr-relay'
          - directory: 'relay-proxy'
            name: 'umbrel-nostr-relay-proxy'
          - directory: 'engine'
            name: 'nostr-rs-relay'
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/getumbrel/${{ matrix.service.name }}
      IMAGE_TAG: ${{ matrix.service.name == 'nostr-rs-relay' && format('0.10.0-{0}', github.ref_name) || github.ref_name }}
      ARCH: ${{ matrix.platform.arch }}
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout pinned engine wrapper
        if: matrix.service.name == 'nostr-rs-relay'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: getumbrel/docker-nostr-rs-relay
          ref: 66b5a626c782fc57c6c415d235b06b0c246cfd30
          path: engine

      - name: Setup Docker buildx action
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push native image
        working-directory: ${{ matrix.service.directory }}
        run: |
          docker buildx build \
            --tag "$IMAGE:$IMAGE_TAG-$ARCH" \
            --platform "linux/$ARCH" \
            --push .

  publish:
    needs: build
    name: Publish ${{ matrix.image }} manifest
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [umbrel-nostr-relay, umbrel-nostr-relay-proxy, nostr-rs-relay]
    env:
      IMAGE: ghcr.io/getumbrel/${{ matrix.image }}
      IMAGE_TAG: ${{ matrix.image == 'nostr-rs-relay' && format('0.10.0-{0}', github.ref_name) || github.ref_name }}
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker buildx action
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Publish and verify both architectures
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$IMAGE_TAG" \
            "$IMAGE:$IMAGE_TAG-amd64" \
            "$IMAGE:$IMAGE_TAG-arm64"
          docker buildx imagetools inspect --raw "$IMAGE:$IMAGE_TAG" \
            | jq --exit-status '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
          docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
